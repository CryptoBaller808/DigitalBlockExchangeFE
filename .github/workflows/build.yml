name: Build test

on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production
      DISABLE_ESLINT_PLUGIN: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 16
      - run: npm i -f
      - run: npm run build
